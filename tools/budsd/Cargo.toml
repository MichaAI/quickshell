[package]
name = "budsd"
version = "0.1.0"
edition = "2021"
description = "Демон наушников для шелла: RFCOMM через BlueZ, JSON-RPC 2.0 в stdin/stdout"
license = "MIT"

[dependencies]
futures-util = "0.3"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "net", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
strip = true
