[package]
name = "logind"
version = "0.1.0"
edition = "2021"
description = "QML-плагин MichaAI.Logind: инхибиторы, сон и подсказки сессии logind по D-Bus"
license = "MIT"

# Динамический QML-плагин: Qt грузит его сам по qmldir
[lib]
crate-type = ["cdylib"]

[dependencies]
async-channel = "2"
async-io = "2"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
futures-util = "0.3"
zbus = "5"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = true
strip = true
